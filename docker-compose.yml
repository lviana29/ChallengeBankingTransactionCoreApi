      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_URL:-ghcr.io/challengebanking/transaction:latest}
    restart: always
    networks:
      - rede_ChallengeBanking

networks:
  rede_ChallengeBanking:
    external: true
    name: ${NETWORK_NAME}
